  <style>

    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:34px}figure{margin:0;background:#eadff6;border-radius:25px;padding:20px 15px 14px}figure:nth-child(2n){background:#eee8f5}figcaption{font-size:12px;font-weight:650;color:#a087b3;display:flex;justify-content:space-between;margin:0 8px 13px}img{display:block;width:100%;height:auto;max-width:390px;margin:auto;filter:drop-shadow(0 10px 15px #5b397e12)}footer{font-size:12px;color:#9e88b1;margin-top:30px}
